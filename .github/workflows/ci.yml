name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-34"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test ShrinkGuard
        run: ./gradlew check

      - name: Build and test samples
        run: ./gradlew -p samples check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/**"

  samples-agp8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-34"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Pin AGP 8.7.3 and enable Kotlin Android plugin for sample
        run: |
          sed -i 's/^agp = ".*"/agp = "8.7.3"/' gradle/libs.versions.toml
          grep -q '^agp = "8.7.3"' gradle/libs.versions.toml
          echo "shrinkguard.useKotlinAndroidPlugin=true" >> samples/gradle.properties

      - name: Build Android sample on AGP 8.7.3
        run: ./gradlew -p samples :android-library:check
